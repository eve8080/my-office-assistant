AWSTemplateFormatVersion: '2010-09-09'
Description: My Office Assistant with private static hosting and client-encrypted S3 note synchronization behind CloudFront.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: My Office Assistant

  NotesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldNotebookVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Application
          Value: My Office Assistant
        - Key: DataClassification
          Value: ClientEncryptedNotes

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-oac'
        Description: Signed CloudFront access to the private application bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  NotesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-notes-oac'
        Description: Signed CloudFront read and write access to encrypted notebook objects.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  NotesOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-notes-origin-request'
        Comment: Forward the encrypted object content type and conditional-write headers to S3.
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Content-Type
            - If-Match
            - If-None-Match
        QueryStringsConfig:
          QueryStringBehavior: none

  NotesRequestValidator:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-notes-request-validator'
      AutoPublish: true
      FunctionConfig:
        Comment: Restrict S3 synchronization to fixed JSON notebook object paths, methods, sizes and content type.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var notebookPath = new RegExp('^/sync/notebooks/[a-f0-9]{64}\\.json$');
          var allowed = ['GET', 'HEAD', 'OPTIONS', 'PUT'];
          if (!notebookPath.test(request.uri)) {
            return { statusCode: 400, statusDescription: 'Bad Request' };
          }
          if (allowed.indexOf(request.method) === -1) {
            return {
              statusCode: 405,
              statusDescription: 'Method Not Allowed',
              headers: { allow: { value: 'GET, HEAD, OPTIONS, PUT' } }
            };
          }
          if (request.method === 'PUT') {
            var length = request.headers['content-length'];
            if (length && parseInt(length.value, 10) > 786432) {
              return { statusCode: 413, statusDescription: 'Payload Too Large' };
            }
            var contentType = request.headers['content-type'];
            var multiple = contentType && contentType.multiValue && contentType.multiValue.length > 1;
            if (!contentType || multiple || String(contentType.value).trim().toLowerCase() !== 'application/json') {
              return { statusCode: 415, statusDescription: 'Unsupported Media Type' };
            }
          }
          return request;
        }

  SiteResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: Security headers for the encrypted note application.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  NotesResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-notes-security-headers'
        Comment: Inert, non-cacheable responses for encrypted notebook objects under /sync/*.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; sandbox"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: no-store, max-age=0
              Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: My Office Assistant
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: private-site-s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: {}
          - Id: private-notes-s3-origin
            DomainName: !GetAtt NotesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt NotesOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: private-site-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SiteResponseHeadersPolicy
        CacheBehaviors:
          - PathPattern: /sync/*
            TargetOriginId: private-notes-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            # CloudFront only accepts three AllowedMethods sets, and PUT is only available in
            # the full set. POST, PATCH and DELETE are rejected with 405 by the viewer-request
            # NotesRequestValidator before any origin request, and the notes bucket policy
            # grants only s3:GetObject and s3:PutObject.
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            # Managed CachingDisabled policy.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref NotesOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref NotesResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt NotesRequestValidator.FunctionARN
      Tags:
        - Key: Application
          Value: My Office Assistant

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  NotesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NotesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontEncryptedNotebookAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub '${NotesBucket.Arn}/sync/notebooks/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
          # S3 returns 403 instead of 404 for a missing object unless the caller also has
          # s3:ListBucket. This grant lets a notebook that does not exist yet read as 404,
          # so 403 keeps meaning a real access problem. It cannot be used to enumerate
          # notebooks: the viewer-request NotesRequestValidator only accepts
          # /sync/notebooks/<64 hex>.json, and NotesOriginRequestPolicy forwards no query
          # strings, so no list request can be issued through CloudFront. No s3:prefix
          # condition is used because S3 evaluates this permission for GetObject requests,
          # where that key does not exist.
          - Sid: AllowCloudFrontNotebookExistenceCheck
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt NotesBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  BucketName:
    Description: Private static application bucket.
    Value: !Ref SiteBucket
  NotesBucketName:
    Description: Private S3 bucket containing only client-encrypted notebook payloads.
    Value: !Ref NotesBucket
  DistributionId:
    Description: CloudFront distribution identifier.
    Value: !Ref SiteDistribution
  CloudFrontDomainName:
    Description: Public CloudFront domain.
    Value: !GetAtt SiteDistribution.DomainName
  ApplicationUrl:
    Description: Public HTTPS application URL.
    Value: !Sub 'https://${SiteDistribution.DomainName}'
